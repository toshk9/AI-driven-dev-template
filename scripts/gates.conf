# Tunable limits for scripts/check-structure.sh, finish-step.sh and intake-done.sh.
# Plain shell assignments. Modes: fail = block, warn = print WARNING and continue, off = disabled.
MAX_FILE_LINES=250      # source file length limit
MAX_TEST_LINES=300      # test file length limit
STRUCTURE_GATE=fail     # file length limit
EMPTY_DIR_GATE=fail     # catch empty junk directories (e.g., Windows bash backslash accidents)
DOCKER_GATE=warn        # check Dockerfile for :latest tag and non-root USER
SCOPE_GATE=warn         # a step may change only the files listed in its plan line
TEST_GATE=fail          # source changes need a test change in the same step
PLAN_GATE=fail          # intake: plan must name real file paths and not put most steps into one file
